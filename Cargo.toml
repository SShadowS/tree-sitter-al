[package]
name = "tree-sitter-al"
description = "AL for Business Central"
version = "4.4.1"
authors = ["Torben Leth <sshadows@sshadows.dk>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "al"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/sshadows/tree-sitter-al"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/highlights.scm",
  "queries/locals.scm",
  "queries/tags.scm",
  "queries/folds.scm",
  "queries/indents.scm",
  "queries/textobjects.scm",
  "src/*",
  "traversal/policy.json",
]

[lib]
path = "bindings/rust/lib.rs"

[features]
default = []
# The classified traversal helper (roadmap F0). The only part of this crate that needs
# the tree-sitter runtime; serde_json is already a dependency of tree-sitter 0.25/0.26.
traversal = ["dep:tree-sitter", "dep:serde_json"]

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = { version = ">=0.25, <0.27", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = ">=0.25, <0.27"
serde_json = "1"
