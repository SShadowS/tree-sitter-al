name: CI

on:
  push:
    branches:
      - main
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - tools/**
      - binding.gyp
      # The gate scripts themselves. Without these, editing validate-grammar.sh
      # or parse-al-parallel.sh -- the two things the gate self-test exists to
      # check -- would not trigger the job that checks them.
      - validate-grammar.sh
      - parse-al-parallel.sh
      - .github/workflows/ci.yml
      - traversal/**
      - tests/**
      - package.json
      - Cargo.toml
      - setup.py
      - MANIFEST.in
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - tools/**
      - binding.gyp
      # The gate scripts themselves. Without these, editing validate-grammar.sh
      # or parse-al-parallel.sh -- the two things the gate self-test exists to
      # check -- would not trigger the job that checks them.
      - validate-grammar.sh
      - parse-al-parallel.sh
      - .github/workflows/ci.yml
      - traversal/**
      - tests/**
      - package.json
      - Cargo.toml
      - setup.py
      - MANIFEST.in

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}

  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check for scanner changes
        id: scanner-check
        shell: sh
        run: |-
          {
            test -f src/scanner.c && ! git diff --quiet HEAD^ -- "$_" &&
            printf 'changed=true\n' || printf 'changed=false\n'
          } >> "$GITHUB_OUTPUT"
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'

  query-coverage-selftest:
    # NOTE: this runs the harness's OWN unit tests, NOT the corpus gate.
    # `qc run` needs BC.History, which is gitignored and absent on runners, so the
    # gate that finds grammar defects still only runs locally via validate-grammar.sh
    # Step 5d. Do not read a green check here as "the CST was verified lossless" --
    # it means the harness itself is not broken. See tools/query_coverage/README.md.
    name: Query-coverage harness self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Install harness dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      - name: Run harness unit tests
        run: python -m pytest tools/query_coverage/tests -q

      # A MISSING node for a HIDDEN token is printed by neither `tree-sitter
      # parse` nor its --json-summary; only py-tree-sitter's has_error sees it
      # (docs/deferred-work.md item 12). BC.History is absent here, so the sweep
      # covers the positive corpus fixtures and the committed gate-fixture corpus.
      # The sweep's unit tests (test_has_error_sweep.py) and test_alc_probe.py run
      # in the config-oracle job, with the rest of tools/config_oracle/tests.
      - name: has_error sweep over the positive corpus fixtures
        run: python tools/has_error_sweep.py --corpus-fixtures

      - name: has_error sweep over the gate-fixture AL corpus
        run: python tools/has_error_sweep.py --root tools/gate-fixtures/al-corpus

  config-oracle:
    # The configuration-consistency oracle as a gate (roadmap A3): its unit tests,
    # the quick tier -- the same command as validate-grammar.sh Step 5e, needing no
    # corpus -- and the historical-defect replays. The resolve and full tiers need
    # the production corpora, which runners do not have (roadmap C3).
    name: Config oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Replays build the parser from commits before each fix (replay.py), so the
      # whole history must be present; a shallow clone makes replay exit 2.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Install dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      # All of tools/config_oracle/tests. `slow` tests (a historical-parser build or
      # the real `al` compiler) are deselected without `-m` by the suite's conftest.
      - name: Oracle unit tests
        run: python -m pytest tools/config_oracle/tests -q

      # tools/perf (roadmap A5): percentile maths, `compare`, edit offsets and points,
      # the tree comparator and the process-tree sampler. No corpus needed.
      - name: Perf tooling unit tests
        run: python -m pytest tools/perf/tests -q

      # Tests for the standalone gate scripts under tools/ (tools/check-runtime-ranges.py).
      - name: Tool unit tests
        run: python -m pytest tools/tests -q

      - name: Quick tier (census, self-tests, fixture differential)
        run: python -m tools.config_oracle run --tier quick

      # One parser per historical commit, built into $TMPDIR/tree-sitter-al-replay/<sha>
      # (replay.CACHE). The commits are listed in replay.py, so its hash is the key;
      # the built files never change for a given sha. A miss only costs the builds.
      - name: Cache historical parsers
        uses: actions/cache@v4
        with:
          path: /tmp/tree-sitter-al-replay
          key: replay-parsers-${{ runner.os }}-${{ hashFiles('tools/config_oracle/replay.py') }}

      # Exit 2 when a commit or a build is unavailable: a replay is never skipped.
      - name: Historical-defect replays
        run: python -m tools.config_oracle replay

  traversal:
    # Roadmap F0: the classified traversal helper. One policy (traversal/policy.json),
    # one set of fixtures (tests/traversal/fixtures) whose expected visits the Python
    # walker writes; Rust (here) and Node (traversal-node) must match them.
    name: Traversal helper (Python, Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Install dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      - name: Policy census (validate-grammar.sh Step 5f)
        run: python tools/traversal_census.py

      - name: Walker, SplitInfo, witnesses, canaries, expected visits
        run: python -m pytest tests/traversal -q

      # The feature declares tree-sitter >=0.25, <0.27: test both ends.
      - name: Rust on tree-sitter 0.25
        run: cargo update -p tree-sitter --precise 0.25.10 && cargo test --features traversal

      - name: Rust on tree-sitter 0.26
        run: cargo update -p tree-sitter --precise 0.26.13 && cargo test --features traversal

  traversal-node:
    name: Traversal helper (Node ${{ matrix.node }}, native and WASM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # The install script builds the native binding from src/ (there are no prebuilds
      # in the repo), so the native leg tests the committed grammar, never a stale build.
      - name: Install
        run: npm ci

      # `npm test` is `node --test` over tests/traversal/js/*.test.js, listed by name:
      # a directory argument is loaded as a module on Node 24.
      - name: Parity and canaries under both JS runtimes
        run: npm test

  traversal-packages:
    # Each published artifact, installed clean outside the checkout, must carry the
    # policy and walk a tree. npm installs with --ignore-scripts: the traversal module
    # must work without the native addon.
    name: Traversal helper in the packaged artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Python sdist, installed into a clean venv
        run: |
          python -m pip install build
          python -m build --sdist --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.tar.gz "tree-sitter~=0.25"
          cd "$RUNNER_TEMP"
          cat > check.py <<'EOF'
          from tree_sitter import Language, Parser
          import tree_sitter_al
          from tree_sitter_al import traversal
          policy = traversal.load_policy()
          src = b"codeunit 1 C\n{\n#if A\n    procedure P()\n    begin\n    end;\n#endif\n}\n"
          tree = Parser(Language(tree_sitter_al.language())).parse(src)
          doc = traversal.Document(tree, src, policy)
          v = next(x for x in traversal.walk(doc, policy) if x.type == "preproc_conditional")
          assert (v.cls, v.host) == ("branch-container", "splice-repeat"), v
          assert tree_sitter_al.HIGHLIGHTS_QUERY, "the sdist shipped no queries"
          print("python sdist clean install: ok")
          EOF
          "$RUNNER_TEMP/venv/bin/python" check.py

      - name: npm tarball, installed with scripts off
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/npm-clean" && cd "$RUNNER_TEMP/npm-clean"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/sshadows-tree-sitter-al-*.tgz web-tree-sitter@0.27.0
          cat > check.js <<'EOF'
          const T = require('@sshadows/tree-sitter-al/traversal');
          const { Parser, Language } = require('web-tree-sitter');
          (async () => {
            await Parser.init();
            const p = new Parser();
            p.setLanguage(await Language.load(require.resolve('@sshadows/tree-sitter-al/tree-sitter-al.wasm')));
            const text = 'codeunit 1 C\n{\n#if A\n    procedure P()\n    begin\n    end;\n#endif\n}\n';
            const policy = T.loadPolicy();
            const doc = new T.Document(p.parse(text), text, policy);
            const v = T.walk(doc, policy).find((x) => x.type === 'preproc_conditional');
            if (!v || v.cls !== 'branch-container' || v.host !== 'splice-repeat') throw new Error('traversal from the packed tarball is broken');
            console.log('npm clean install: ok');
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
          node check.js

      - name: Crate carries the policy and builds with the feature
        run: |
          cargo package --allow-dirty --list | grep -qx 'traversal/policy.json'
          cargo package --allow-dirty --features traversal

  gate-selftest:
    # Mutation testing for the VALIDATION GATES, not for the grammar.
    #
    # Every other job here checks that the parser is right. This one checks that
    # the things which check the parser can still say "no": it breaks something
    # on purpose, runs the real gate end to end, and requires the gate to exit
    # non-zero AND to name what was broken. A gate that fails for the wrong
    # reason does not pass. See tools/gate_selftest.py for why this exists.
    #
    # It runs here rather than only inside validate-grammar.sh on purpose: a
    # self-test that fires only when someone remembers to run the validator
    # inherits the problem it is meant to solve.
    #
    # Note on coverage: the step5c-fieldwalk case SKIPS on a runner, because it
    # needs the vendored tree-sitter runtime that bindings/c/build.sh fetches on
    # demand and CI does not have. Skips are counted and printed separately from
    # passes; they are never folded into the pass count.
    name: Gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      # validate-grammar.sh Step 5d imports the query-coverage harness. Without
      # its dependencies the step fails for an unrelated reason and every case
      # that expects a clean run would fail with it.
      - name: Install query-coverage dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      - name: Check every degradation guard is justified
        run: python tools/gate_selftest.py --sweep

      - name: Prove the harness's own guards fire
        run: python tools/gate_selftest.py --prove-guards

      - name: Run the gate self-test
        run: python tools/gate_selftest.py

      # ts-lock.sh and validate-grammar.sh source it; its Windows cases run
      # here on stubs, since no Windows job sources it.
      - name: Check the default-compiler rule (tools/default-cc.sh)
        run: bash tools/test-default-cc.sh

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build parser
        run: tree-sitter build

      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz

      - name: Check queries
        run: ./ts_query_ls check -f queries/

  wasm-freshness:
    # build-wasm.yml's release job runs `cp tree-sitter-al.wasm artifacts/` -- it
    # does NOT build the wasm, so whatever is committed is what every
    # web-tree-sitter consumer gets. Nothing else in CI loads the wasm, so a
    # stale one is invisible here: v4.0.0 shipped a fresh build, the next grammar
    # fix landed, and the committed wasm kept parsing `Filter: Codeunit "X";`
    # with an ERROR while the whole matrix stayed green.
    name: Committed wasm matches committed sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check wasm freshness
        run: tools/check-wasm-fresh.sh

      # Index modes are invisible on the Windows machines this repo is written
      # on. A 100644 script exec'd by another script fails only here, on Linux
      # -- which is what kept "Gate self-test" red from its first run.
      - name: Check every tracked script is executable
        run: bash tools/check-exec-bits.sh

      # src/parser.c's ABI against every declared tree-sitter runtime range
      # (validate-grammar.sh Step 11). Needs only Python's stdlib (tomllib).
      - name: Check declared runtime ranges load the grammar's ABI
        run: python3 tools/check-runtime-ranges.py

  scanner-default-flags:
    # Every first-party build of src/scanner.c passes -std=c11 (Makefile),
    # /std:c11 (binding.gyp) or cc.std("c11") (bindings/rust/build.rs), so no
    # job here ever compiled it the way a third-party consumer does: with the
    # compiler's DEFAULT flags. A `_MSC_VER >= 1928` arm on the _Static_assert
    # guard shipped in 4.0.0 and broke exactly that build -- MSVC's C compiler
    # rejects _Static_assert unless /std:c11 or /std:c17 is passed -- and the
    # whole matrix above stayed green because none of it reproduces the
    # configuration. Reported by a downstream consumer, not by CI.
    #
    # The two must-fail cases are what make this job worth having. "It compiles
    # clean" also passes if the guard is deleted outright, so the job narrows
    # ScannerDepth to uint8_t and requires the build to FAIL both ways: via
    # _Static_assert under /std:c11 and via the negative-array fallback under
    # default flags. A must-fail case that starts passing is a dead guard.
    name: Scanner compiles with default compiler flags
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile src/scanner.c four ways under MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsroot) { throw "no MSVC toolset on this runner" }
          $vcvars = Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          $work = Join-Path $env:RUNNER_TEMP 'scanner-flags'
          New-Item -ItemType Directory -Force $work | Out-Null

          # Same file with the depth counter narrowed back to the type whose wrap
          # the guard exists to prevent. The replacement must actually happen --
          # a no-op edit would make both must-fail cases compile and pass.
          $src = Get-Content src\scanner.c -Raw
          $narrowed = $src -replace 'typedef uint32_t ScannerDepth;', 'typedef uint8_t ScannerDepth;'
          if ($narrowed -eq $src) { throw "could not narrow ScannerDepth: the typedef this job mutates has been renamed or reworded, so the two must-fail cases below would assert nothing" }
          $narrowedPath = Join-Path $work 'scanner-narrowed.c'
          Set-Content -Path $narrowedPath -Value $narrowed -NoNewline

          function Invoke-Cl($label, $std, $file) {
            $stdArg = if ($std) { "-std:$std " } else { "" }
            $obj = Join-Path $work "$label.obj"
            $log = cmd /c "`"$vcvars`" >nul 2>&1 && cl -nologo -c $stdArg-Isrc -Fo`"$obj`" `"$file`" 2>&1"
            return @{ code = $LASTEXITCODE; log = ($log | Out-String) }
          }

          $failures = @()
          $cases = @(
            @{ label = 'real-default';     std = $null; file = 'src\scanner.c'; expect = 'pass' },
            @{ label = 'real-c11';         std = 'c11';  file = 'src\scanner.c'; expect = 'pass' },
            @{ label = 'narrowed-default'; std = $null; file = $narrowedPath;   expect = 'fail' },
            @{ label = 'narrowed-c11';     std = 'c11';  file = $narrowedPath;   expect = 'fail' }
          )
          foreach ($c in $cases) {
            $r = Invoke-Cl $c.label $c.std $c.file
            $got = if ($r.code -eq 0) { 'pass' } else { 'fail' }
            "== $($c.label): expected $($c.expect), got $got =="
            if ($got -ne $c.expect) {
              $failures += $c.label
              $r.log
            }
          }
          if ($failures.Count -gt 0) { throw "unexpected result for: $($failures -join ', ')" }
          # Required. GitHub's pwsh wrapper appends `exit $LASTEXITCODE`, and the
          # last thing this script runs is a cl invocation that is SUPPOSED to
          # fail -- without this the step reports failure on a fully green run.
          exit 0
