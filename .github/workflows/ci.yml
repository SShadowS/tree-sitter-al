name: CI

on:
  push:
    branches:
      - main
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - tools/**
      - binding.gyp
      # The gate scripts themselves. Without these, editing validate-grammar.sh
      # or parse-al-parallel.sh -- the two things the gate self-test exists to
      # check -- would not trigger the job that checks them.
      - validate-grammar.sh
      - parse-al-parallel.sh
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - bindings/**
      - tools/**
      - binding.gyp
      # The gate scripts themselves. Without these, editing validate-grammar.sh
      # or parse-al-parallel.sh -- the two things the gate self-test exists to
      # check -- would not trigger the job that checks them.
      - validate-grammar.sh
      - parse-al-parallel.sh
      - .github/workflows/ci.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: ${{runner.os == 'Linux'}}

  fuzz:
    name: Fuzz scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check for scanner changes
        id: scanner-check
        shell: sh
        run: |-
          {
            test -f src/scanner.c && ! git diff --quiet HEAD^ -- "$_" &&
            printf 'changed=true\n' || printf 'changed=false\n'
          } >> "$GITHUB_OUTPUT"
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        if: steps.scanner-check.outputs.changed == 'true'

  query-coverage-selftest:
    # NOTE: this runs the harness's OWN unit tests, NOT the corpus gate.
    # `qc run` needs BC.History, which is gitignored and absent on runners, so the
    # gate that finds grammar defects still only runs locally via validate-grammar.sh
    # Step 5d. Do not read a green check here as "the CST was verified lossless" --
    # it means the harness itself is not broken. See tools/query_coverage/README.md.
    name: Query-coverage harness self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Install harness dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      - name: Run harness unit tests
        run: python -m pytest tools/query_coverage/tests -q

  gate-selftest:
    # Mutation testing for the VALIDATION GATES, not for the grammar.
    #
    # Every other job here checks that the parser is right. This one checks that
    # the things which check the parser can still say "no": it breaks something
    # on purpose, runs the real gate end to end, and requires the gate to exit
    # non-zero AND to name what was broken. A gate that fails for the wrong
    # reason does not pass. See tools/gate_selftest.py for why this exists.
    #
    # It runs here rather than only inside validate-grammar.sh on purpose: a
    # self-test that fires only when someone remembers to run the validator
    # inherits the problem it is meant to solve.
    #
    # Note on coverage: the step5c-fieldwalk case SKIPS on a runner, because it
    # needs the vendored tree-sitter runtime that bindings/c/build.sh fetches on
    # demand and CI does not have. Skips are counted and printed separately from
    # passes; they are never folded into the pass count.
    name: Gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      # validate-grammar.sh Step 5d imports the query-coverage harness. Without
      # its dependencies the step fails for an unrelated reason and every case
      # that expects a clean run would fail with it.
      - name: Install query-coverage dependencies
        run: pip install -r tools/query_coverage/requirements.txt

      - name: Check every degradation guard is justified
        run: python tools/gate_selftest.py --sweep

      - name: Prove the harness's own guards fire
        run: python tools/gate_selftest.py --prove-guards

      - name: Run the gate self-test
        run: python tools/gate_selftest.py

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - name: Set up repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build parser
        run: tree-sitter build

      - name: Set up ts_query_ls
        run: curl -fL https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz | tar -xz

      - name: Check queries
        run: ./ts_query_ls check -f queries/
