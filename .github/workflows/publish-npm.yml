name: Publish npm Package

# Triggered directly on the tag rather than through a wrapper workflow.
# npm validates trusted publishing against the CALLING workflow, so running
# this from a reusable-workflow caller would not match the trusted publisher
# registered for publish-npm.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # No registry-url: it makes setup-node write an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN} and export that variable as the literal
      # placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm then authenticates with that
      # bogus token, gets a 404, and never falls back to OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # Node 24 already ships an npm new enough for trusted publishing
      # (>= 11.5.1), but track the current release rather than the minimum.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Debug OIDC environment
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-NO}"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-unset}"
          echo "registry: $(npm config get registry)"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- userconfig contents ---"
            sed 's/=.*/=<redacted>/' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install dependencies
        run: npm ci

      # No NODE_AUTH_TOKEN: authentication is OIDC via the trusted publisher.
      # Provenance attestations are generated automatically in that mode.
      - name: Publish to npm
        run: npm publish --access public
