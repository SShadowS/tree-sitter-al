name: Publish npm Package

# Triggered directly on the tag rather than through a wrapper workflow.
# npm validates trusted publishing against the CALLING workflow, so running
# this from a reusable-workflow caller would not match the trusted publisher
# registered for publish-npm.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # Node 24 already ships an npm new enough for trusted publishing
      # (>= 11.5.1), but track the current release rather than the minimum.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      # No NODE_AUTH_TOKEN: authentication is OIDC via the trusted publisher.
      # Provenance attestations are generated automatically in that mode.
      - name: Publish to npm
        run: npm publish --access public
