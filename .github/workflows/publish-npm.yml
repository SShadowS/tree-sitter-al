name: Publish npm Package

# Triggered directly on the tag rather than through a wrapper workflow.
# npm validates trusted publishing against the CALLING workflow, so running
# this from a reusable-workflow caller would not match the trusted publisher
# registered for publish-npm.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Workflow-level, matching npm's documented trusted publishing example.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the environment named in the trusted publisher settings.
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      # No NODE_AUTH_TOKEN: authentication is OIDC via the trusted publisher.
      # Provenance attestations are generated automatically in that mode.
      # Authentication is OIDC via the trusted publisher configured on npmjs;
      # provenance attestations are generated automatically in that mode.
      #
      # NODE_AUTH_TOKEN is blanked because setup-node's registry-url exports it
      # as the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX. OIDC overrides it on
      # success, but if the exchange ever fails npm falls back to that bogus
      # token and reports a misleading 404 instead of the real reason. Blanking
      # it makes such a failure surface honestly.
      #
      # To debug a failed exchange, add --loglevel silly: the reason is logged
      # as "npm verbose oidc Failed token exchange request with body message".
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ""
