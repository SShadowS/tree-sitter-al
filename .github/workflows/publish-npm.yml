name: Publish npm Package

# Triggered directly on the tag rather than through a wrapper workflow.
# npm validates trusted publishing against the CALLING workflow, so running
# this from a reusable-workflow caller would not match the trusted publisher
# registered for publish-npm.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Workflow-level, matching npm's documented trusted publishing example.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the environment named in the trusted publisher settings.
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Debug OIDC environment
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-NO}"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-unset}"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- userconfig contents ---"
            sed 's/\(_authToken=\).*/\1<redacted>/' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install dependencies
        run: npm ci

      # No NODE_AUTH_TOKEN: authentication is OIDC via the trusted publisher.
      # Provenance attestations are generated automatically in that mode.
      # setup-node exports NODE_AUTH_TOKEN as the literal placeholder
      # XXXXX-XXXXX-XXXXX-XXXXX, which npm sends as a real token and the
      # registry rejects with a 404 before OIDC is ever attempted. Blank it
      # so the .npmrc entry resolves empty and trusted publishing can engage.
      - name: Publish to npm
        run: npm publish --access public --loglevel silly
        env:
          NODE_AUTH_TOKEN: ""
