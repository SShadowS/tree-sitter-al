name: Publish Python Package

# Triggered directly on the tag rather than through a wrapper workflow.
# PyPI validates trusted publishing against the CALLING workflow, so running
# this from a reusable-workflow caller would not match the trusted publisher
# registered for publish-pypi.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: [get-version]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set version
        shell: python
        run: |
          import re, pathlib
          v = "${{ needs.get-version.outputs.version }}"
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'version = "0\.0\.0"', f'version = "{v}"', p.read_text()))
      - run: pip install cibuildwheel
      - run: cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    needs: [get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set version
        shell: python
        run: |
          import re, pathlib
          v = "${{ needs.get-version.outputs.version }}"
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'version = "0\.0\.0"', f'version = "{v}"', p.read_text()))
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
