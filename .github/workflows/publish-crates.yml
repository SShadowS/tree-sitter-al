name: Publish Rust Crate

# Triggered directly on the tag, matching the npm and PyPI workflows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify versions agree
        run: |
          pkg="$(node -p "require('./package.json').version")"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$pkg" != "$crate" ]; then
            echo "::error::Cargo.toml version $crate does not match package.json version $pkg"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing crate version $crate"

      # Exchanges the GitHub OIDC token for a short-lived crates.io token,
      # revoked automatically when the job ends. No stored secret required.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
