name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag to package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Manual dispatch from $GITHUB_REF_NAME; skipping tag check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing version $pkg"

  npm:
    name: npm
    needs: [verify]
    uses: ./.github/workflows/publish-npm.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  pypi:
    name: PyPI
    needs: [verify]
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  crates:
    name: crates.io
    needs: [verify]
    uses: ./.github/workflows/publish-crates.yml
    secrets: inherit
    permissions:
      contents: read
